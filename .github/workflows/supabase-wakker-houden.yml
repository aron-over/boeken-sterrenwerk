name: Supabase wakker houden

# Voorkomt dat het gratis Supabase-project na 7 dagen inactiviteit wordt gepauzeerd.
on:
  schedule:
    - cron: '0 6 */3 * *'   # elke 3 dagen
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Eén rij ophalen uit boeken
        run: |
          URL=$(grep -oP "SUPABASE_URL = '\K[^']+" app.js)
          KEY=$(grep -oP "SUPABASE_ANON_KEY = '\K[^']+" app.js)
          curl -fsS "$URL/rest/v1/boeken?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
      # GitHub zet geplande workflows uit na 60 dagen zonder commits. Zichzelf opnieuw
      # inschakelen telt als activiteit, zodat een nep-commit niet nodig is.
      - name: Workflow actief houden
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable supabase-wakker-houden.yml --repo "$GITHUB_REPOSITORY"
